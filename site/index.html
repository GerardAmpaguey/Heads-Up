<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Heads Up</title>
    <meta name="description" content="The important things to prepare for, in one place: hazards and news near you, web dev changes, AI and tech, and the environment." />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#0c0d10" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600&family=Archivo:wdth,wght@100..125,500..800&display=swap" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <a class="skip" href="#main">Skip to the alerts</a>

    <header class="masthead">
      <div class="wrap masthead__bar">
        <a class="brand" href="#/" aria-label="Heads Up home">
          <svg viewBox="0 0 64 64" width="28" height="28" aria-hidden="true"><path d="M32 8 58 52H6z" fill="#e11d2e"/><rect x="29.5" y="24" width="5" height="15" rx="2.5" fill="#fff"/><circle cx="32" cy="45" r="3.2" fill="#fff"/></svg>
          <span>Heads Up</span>
        </a>
        <p class="masthead__tag">What to prepare for, before it reaches you</p>

        <div class="masthead__tools">
          <button class="where" id="where" type="button" aria-haspopup="dialog" title="Change location">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
            <span id="where-label">Set location</span>
            <svg class="where__caret" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <form class="search" id="search" role="search">
            <label class="sr" for="q">Search alerts</label>
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
            <input id="q" name="q" type="search" placeholder="Search alerts" autocomplete="off" />
          </form>
        </div>
      </div>
      <nav class="sections" aria-label="Sections">
        <div class="wrap sections__inner" id="tabs"></div>
      </nav>
    </header>

    <div class="pulse" id="pulse" hidden></div>

    <main id="main" class="wrap" tabindex="-1"></main>

    <footer class="foot">
      <div class="wrap foot__inner">
        <p class="foot__brand">Heads Up</p>
        <p>Hazards and news near you, web dev changes, AI and tech, and environment news, ranked by how much they matter. Always check official sources before acting.</p>
        <p class="foot__status" id="status"></p>
      </div>
    </footer>

    <dialog class="sheet" id="sheet" aria-labelledby="sheet-title"></dialog>
    <dialog class="sheet picker" id="picker" aria-labelledby="picker-title"></dialog>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
